<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
</head>

<body>

    <h1>CRUD</h1>
    <p>Create (inserir)</p>
    <p>Read (buscar)</p>
    <p>Update (alterar)</p>
    <p>Delete (remover)</p>

    <h />

    <input id="inputNome" placeholder="Digite um nome" />

    <button onclick="inserir()">Salvar</button>

    <ul id="listaUsuarios">

    </ul>



    <script>

        // Dados mockados
        let nomes = [,"Pato", "Gato", "Rato"] // Array/vetor
        
        buscarTodos()

        if (nome.trim().length < 3) { //trim para cortar espaços na caixa de senha e usuario na hr de verificar
                alert("Inválido")
                
            }


        function inserir(){
            let nome = document.getElementById("inputNome").value
            nomes = nomes.concat( nome )
            console.log( nomes )
            buscarTodos()
            document.getElementById("inputNome").value = ""
        }
        


        function buscarTodos() {
            let html = ""
            nomes.map( i => html += "<li>  "+i+" <button>🖊</button> <button>🗑</button> </li>" )
            document.getElementById("listaUsuarios").innerHTML = html
        }

    </script>

</body>

</html>
